name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Lint with Ruff
      run: |
        ruff check src/ tests/
        ruff format --check src/ tests/

    - name: Type check with MyPy
      run: |
        mypy src/apttrail/

    - name: Test with pytest
      run: |
        pytest --cov=apttrail --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml

  # Parse the rules we generate with the real Suricata engine. Unit tests can
  # assert on rule text; only Suricata can say whether it loads. A previous
  # release shipped rules with a negated file-hash match and an unescaped
  # quote, which is exactly what this catches.
  suricata:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install APTtrail
      run: pip install -e .

    - name: Install Suricata
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq suricata
        suricata --build-info | head -3

    - name: Generate sample rules (per-indicator mode)
      run: python scripts/make_sample_rules.py rules-plain

    - name: Generate sample rules (dataset mode)
      run: python scripts/make_sample_rules.py rules-dataset --datasets

    - name: Validate with suricata -T
      run: |
        set -o pipefail
        for mode in plain dataset; do
          echo "::group::suricata -T (${mode})"
          mkdir -p "sclog-${mode}"
          suricata -T -c /etc/suricata/suricata.yaml \
            -S "rules-${mode}/apttrail_sample.rules" \
            -l "sclog-${mode}" \
            --set "default-rule-path=${PWD}/rules-${mode}"
          echo "::endgroup::"
        done

  # The README advertises a container image, so build it and check the thing
  # people actually depend on: that the ATT&CK table travels with the package.
  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build image
      run: docker build -t apttrail:ci .

    - name: CLI responds
      run: docker run --rm apttrail:ci --help

    - name: Attribution table is present in the image
      run: |
        docker run --rm --entrypoint python apttrail:ci -c "
        from apttrail.attribution import load_index
        index = load_index()
        assert len(index) > 150, f'attribution table missing or short: {len(index)}'
        assert index.resolve('SOFACY', 'apt28').id == 'G0007'
        print(f'{len(index)} ATT&CK groups available in the image')
        "
