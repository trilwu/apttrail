name: Collect APT Threat Feeds

on:
  schedule:
    # Run every 1 hour
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      update_maltrail:
        description: 'Update Maltrail repository'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'apttrail_threat_feed_collector.py'
      - '.github/workflows/collect-apt-feeds.yml'

jobs:
  collect-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Both caches are keyed on the upstream commit rather than the run id.
    # Keying on the run id would store a fresh ~50MB entry every hour even when
    # nothing upstream moved; keying on the SHA means an exact hit (and no
    # save) whenever Maltrail is unchanged.
    - name: Resolve upstream Maltrail commit
      id: upstream
      run: echo "sha=$(git ls-remote https://github.com/stamparm/maltrail.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

    # apttrail clones Maltrail into data/maltrail itself and pulls on each run.
    # Caching the clone avoids re-downloading ~50MB hourly and, more
    # importantly, keeps the history that `git blame` needs for first_seen.
    - name: Restore Maltrail clone
      uses: actions/cache@v4
      with:
        path: data/maltrail
        key: maltrail-clone-${{ steps.upstream.outputs.sha }}
        restore-keys: maltrail-clone-

    - name: Restore timestamp cache
      uses: actions/cache@v4
      with:
        path: ~/.apttrail
        key: apttrail-timestamps-${{ steps.upstream.outputs.sha }}
        restore-keys: apttrail-timestamps-

    - name: Collect APT indicators
      run: |
        pip install .
        python -m apttrail --output-dir feeds --suricata-dataset --collect-timestamps

    # Nothing is published until Suricata itself accepts the rule file. This
    # is the gate that stops a malformed indicator from reaching users.
    - name: Validate Suricata rules
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq suricata
        mkdir -p rulecheck
        cp feeds/apttrail_threat_feed.rules rulecheck/
        cp feeds/suricata-datasets/*.lst rulecheck/ 2>/dev/null || true
        mkdir -p sclog
        suricata -T -c /etc/suricata/suricata.yaml \
          -S rulecheck/apttrail_threat_feed.rules \
          -l sclog \
          --set "default-rule-path=${PWD}/rulecheck"

    - name: Package Suricata datasets
      run: tar czf feeds/apttrail_suricata_datasets.tar.gz -C feeds suricata-datasets

    - name: Generate feed statistics
      run: python .github/scripts/generate_release_stats.py feeds/apttrail_threat_feed.json > release_notes.md

    # The per-group and per-type slices are served over GitHub Pages rather
    # than as release assets: 339 groups would mean ~600 assets, and analysts
    # want a URL they can construct, not a tarball to unpack. The branch is
    # force-pushed so its history never accumulates.
    - name: Publish slices to GitHub Pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p pages
        cp feeds/index.html feeds/index.json pages/
        cp -r feeds/by-type feeds/by-group pages/
        touch pages/.nojekyll
        cd pages
        git init -q .
        git config user.email "action@github.com"
        git config user.name "GitHub Action"
        git add -A
        git commit -q -m "Publish APTtrail slices"
        git push -q --force \
          "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:gh-pages
        echo "Published to https://trilwu.github.io/apttrail/"

    # The feed files are published as release assets, not committed. Assets are
    # replaced in place, so hourly updates cost nothing in repository size -
    # committing them is what grew this repo to 841MB. STIX and MISP ride along
    # here too; they exceed the 100MB git limit but are fine as assets.
    - name: Publish rolling feed release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest APT Threat Feeds
        body_path: release_notes.md
        make_latest: true
        files: |
          feeds/apttrail_threat_feed.json
          feeds/apttrail_threat_feed.csv
          feeds/apttrail_threat_feed_metadata.csv
          feeds/apttrail_threat_feed.rules
          feeds/apttrail_threat_feed.yar
          feeds/apttrail_threat_feed.yaml
          feeds/apttrail_threat_feed_stix.json
          feeds/apttrail_threat_feed_misp.json
          feeds/apttrail_suricata_datasets.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Only the changelog goes into git: a few KB per day, and it is the record
    # that the feed snapshots cannot provide.
    - name: Commit changelog
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Absent until the first run that observes an actual indicator change.
        if [ ! -d feeds/changes ]; then
          echo "No changelog directory yet"
          exit 0
        fi

        git add feeds/changes/
        if git diff --staged --quiet; then
          echo "No indicator changes to record"
          exit 0
        fi

        git commit -m "chore: record IOC changes"
        git push
        echo "Changelog committed and pushed"

    # Weekly immutable snapshot. The previous condition compared the cron
    # string against itself and was always false, so no release was ever
    # published. make_latest is false so these do not displace the rolling tag.
    - name: Decide weekly release tag
      id: weekly
      if: github.event_name == 'schedule'
      run: |
        TAG="weekly-$(date -u +%G-W%V)"
        if [ "$(date -u +%u)" != "7" ]; then
          echo "Not Sunday, skipping release"
        elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists, skipping release"
        else
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        fi

    - name: Create release (weekly)
      if: steps.weekly.outputs.tag != ''
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.weekly.outputs.tag }}
        name: APT Threat Feeds ${{ steps.weekly.outputs.tag }}
        body_path: release_notes.md
        make_latest: false
        files: |
          feeds/apttrail_threat_feed.json
          feeds/apttrail_threat_feed.csv
          feeds/apttrail_threat_feed_metadata.csv
          feeds/apttrail_threat_feed.rules
          feeds/apttrail_threat_feed.yar
          feeds/apttrail_threat_feed.yaml
          feeds/apttrail_threat_feed_stix.json
          feeds/apttrail_threat_feed_misp.json
          feeds/apttrail_suricata_datasets.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}