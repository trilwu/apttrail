name: Collect APT Threat Feeds

on:
  schedule:
    # Run every 1 hour
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      update_maltrail:
        description: 'Update Maltrail repository'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'apttrail_threat_feed_collector.py'
      - '.github/workflows/collect-apt-feeds.yml'

jobs:
  collect-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # apttrail clones Maltrail into data/maltrail itself and pulls on each run.
    # Caching the clone avoids re-downloading ~50MB hourly and, more
    # importantly, keeps the history that `git blame` needs for first_seen.
    - name: Restore Maltrail clone
      uses: actions/cache@v4
      with:
        path: data/maltrail
        key: maltrail-clone-${{ github.run_id }}
        restore-keys: maltrail-clone-

    # Per-indicator first_seen timestamps. Keyed per run so each run saves a
    # fresh entry; restore-keys picks up the most recent one.
    - name: Restore timestamp cache
      uses: actions/cache@v4
      with:
        path: ~/.apttrail
        key: apttrail-timestamps-${{ github.run_id }}
        restore-keys: apttrail-timestamps-

    - name: Collect APT indicators
      run: |
        pip install .
        python -m apttrail --output-dir feeds --suricata-dataset --collect-timestamps

    - name: Discard JSON if only generated_at changed
      run: |
        # generated_at moves every run, so a plain diff always looks dirty.
        # Compare against HEAD ignoring that field; if nothing else changed,
        # restore the committed copy so we don't push a no-op 7MB blob.
        if [ -f feeds/apttrail_threat_feed.json ]; then
          set +e
          python .github/scripts/detect_material_change.py feeds/apttrail_threat_feed.json
          status=$?
          set -e
          if [ "$status" -eq 1 ]; then
            git checkout -- feeds/apttrail_threat_feed.json || true
          elif [ "$status" -gt 1 ]; then
            echo "::error::change detection failed with status $status"
            exit "$status"
          fi
        fi

    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Only commit files that are under the 100MB limit
        # STIX and MISP are too large (100MB+) so we don't commit them to the repo
        git add feeds/apttrail_threat_feed.json
        git add feeds/apttrail_threat_feed.csv
        git add feeds/apttrail_threat_feed_metadata.csv
        git add feeds/apttrail_threat_feed.rules
        git add feeds/apttrail_threat_feed.yar
        git add feeds/apttrail_threat_feed.yaml
        # Append-only IOC change log; a few KB per day. Absent until the first
        # run that observes an actual indicator change.
        if [ -d feeds/changes ]; then
          git add feeds/changes/
        fi

        if git diff --staged --quiet; then
          echo "No real changes detected (only timestamp updates)"
          exit 0
        fi

        # Generate meaningful commit message based on actual changes
        python3 .github/scripts/generate_commit_message.py > commit_message.txt
        
        if [ -s commit_message.txt ]; then
          git commit -F commit_message.txt
          git push
          echo "Changes committed and pushed"
        else
          echo "No meaningful changes to commit"
        fi

    # Weekly release. The previous condition compared the cron string against
    # itself and was always false, so no release was ever published.
    # Releases also carry the STIX and MISP bundles, which are too large to
    # commit into git but are fine as release assets.
    - name: Decide weekly release tag
      id: weekly
      if: github.event_name == 'schedule'
      run: |
        TAG="weekly-$(date -u +%G-W%V)"
        if [ "$(date -u +%u)" != "7" ]; then
          echo "Not Sunday, skipping release"
        elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists, skipping release"
        else
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        fi

    - name: Generate release notes
      if: steps.weekly.outputs.tag != ''
      run: python .github/scripts/generate_release_stats.py feeds/apttrail_threat_feed.json > release_notes.md

    - name: Create release (weekly)
      if: steps.weekly.outputs.tag != ''
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.weekly.outputs.tag }}
        name: APT Threat Feeds ${{ steps.weekly.outputs.tag }}
        body_path: release_notes.md
        files: |
          feeds/apttrail_threat_feed.json
          feeds/apttrail_threat_feed.csv
          feeds/apttrail_threat_feed_metadata.csv
          feeds/apttrail_threat_feed.rules
          feeds/apttrail_threat_feed.yar
          feeds/apttrail_threat_feed.yaml
          feeds/apttrail_threat_feed_stix.json
          feeds/apttrail_threat_feed_misp.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}