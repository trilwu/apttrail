name: Collect APT Threat Feeds

on:
  schedule:
    # Run every 1 hour
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      update_maltrail:
        description: 'Update Maltrail repository'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/collect-apt-feeds.yml'

# One run at a time. Two runs publishing gh-pages concurrently lose the ref
# lock race, which is how a manual dispatch overlapping the hourly schedule
# failed. Queue rather than cancel: a run that has already validated and built
# should be allowed to publish.
concurrency:
  group: collect-feeds
  cancel-in-progress: false

jobs:
  collect-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Both caches are keyed on the upstream commit rather than the run id.
    # Keying on the run id would store a fresh ~50MB entry every hour even when
    # nothing upstream moved; keying on the SHA means an exact hit (and no
    # save) whenever Maltrail is unchanged.
    - name: Resolve upstream Maltrail commit
      id: upstream
      run: echo "sha=$(git ls-remote https://github.com/stamparm/maltrail.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

    # apttrail clones Maltrail into data/maltrail itself and pulls on each run.
    # Caching the clone avoids re-downloading ~50MB hourly and, more
    # importantly, keeps the history that `git blame` needs for first_seen.
    - name: Restore Maltrail clone
      uses: actions/cache@v4
      with:
        path: data/maltrail
        key: maltrail-clone-${{ steps.upstream.outputs.sha }}
        restore-keys: maltrail-clone-

    - name: Restore timestamp cache
      uses: actions/cache@v4
      with:
        path: ~/.apttrail
        key: apttrail-timestamps-${{ steps.upstream.outputs.sha }}
        restore-keys: apttrail-timestamps-

    # The changelog is a diff against the previous run, and the previous run's
    # feed is a release asset rather than a commit - so a fresh checkout had
    # nothing to compare against and every single run logged "no previous feed,
    # skipping baseline run". The feature had never recorded one event. Pull
    # last run's feed back down first.
    - name: Restore the previous feed for the changelog diff
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p feeds
        if curl -sfL -o feeds/apttrail_threat_feed.json \
             "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/apttrail_threat_feed.json"; then
          python -c "import json; json.load(open('feeds/apttrail_threat_feed.json'))" \
            && echo "previous feed restored" \
            && exit 0
          echo "::error::previous feed downloaded but is not valid JSON"
          exit 1
        fi

        # Distinguish "no release yet" from "the restore broke". The first is a
        # genuine baseline run; the second silently disables the changelog,
        # which is exactly how it went unnoticed for its entire existence.
        if gh release view latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
          echo "::error::the latest release exists but its feed asset could not be fetched"
          exit 1
        fi
        echo "no release yet, this run is the baseline"

    - name: Collect APT indicators
      run: |
        pip install .
        python -m apttrail --output-dir feeds --suricata-dataset --collect-timestamps

    # Nothing is published until Suricata itself accepts the rule file. This
    # is the gate that stops a malformed indicator from reaching users.
    - name: Validate Suricata rules
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq suricata
        mkdir -p rulecheck
        cp feeds/apttrail_threat_feed.rules rulecheck/
        cp feeds/suricata-datasets/*.lst rulecheck/ 2>/dev/null || true
        mkdir -p sclog
        suricata -T -c /etc/suricata/suricata.yaml \
          -S rulecheck/apttrail_threat_feed.rules \
          -l sclog \
          --set "default-rule-path=${PWD}/rulecheck"

    - name: Package Suricata datasets and MISP feed
      run: |
        tar czf feeds/apttrail_suricata_datasets.tar.gz -C feeds suricata-datasets
        tar czf feeds/apttrail_misp_feed.tar.gz -C feeds misp-feed

    - name: Generate feed statistics
      run: python .github/scripts/generate_release_stats.py feeds/apttrail_threat_feed.json > release_notes.md

    # The per-group and per-type slices are served over GitHub Pages rather
    # than as release assets: 339 groups would mean ~600 assets, and analysts
    # want a URL they can construct, not a tarball to unpack. The branch is
    # force-pushed so its history never accumulates.
    - name: Publish slices to GitHub Pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p pages
        cp feeds/index.html feeds/index.json feeds/groups.html pages/
        # The feed-wide "what moved recently" view, for a reader who does not
        # already have an actor name to look up, plus its Atom feed - the
        # mechanism by which this gets checked daily rather than found once.
        cp feeds/activity.html feeds/activity.json feeds/activity.xml pages/
        # Crawlers have nothing pointing them at 314 actor pages otherwise.
        cp feeds/sitemap.xml feeds/robots.txt pages/
        # Client-side IOC lookup over the shards; no backend, and nothing the
        # analyst types leaves their machine.
        cp feeds/search.html pages/
        # How the groups relate, and the data behind it.
        cp feeds/graph.html feeds/graph.json pages/
        cp -r feeds/by-type feeds/by-group pages/
        # Served as a real MISP feed: manifest.json + one event per group.
        cp -r feeds/misp-feed pages/
        # Per-indicator lookup: sha256-sharded so a client fetches 1/256th
        # of the data to answer 'what do you know about this domain?'
        cp -r feeds/by-indicator pages/
        touch pages/.nojekyll
        cd pages
        git init -q .
        git config user.email "action@github.com"
        git config user.name "GitHub Action"
        git add -A
        git commit -q -m "Publish APTtrail slices"
        git push -q --force \
          "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:gh-pages
        echo "Published to https://trilwu.github.io/apttrail/"

    # The feed files are published as release assets, not committed. Assets are
    # replaced in place, so hourly updates cost nothing in repository size -
    # committing them is what grew this repo to 841MB. STIX and MISP ride along
    # here too; they exceed the 100MB git limit but are fine as assets.
    - name: Publish rolling feed release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest APT Threat Feeds
        body_path: release_notes.md
        make_latest: true
        files: |
          feeds/apttrail_threat_feed.json
          feeds/apttrail_threat_feed.csv
          feeds/apttrail_threat_feed_metadata.csv
          feeds/apttrail_threat_feed.rules
          feeds/apttrail_threat_feed.yar
          feeds/apttrail_threat_feed.yaml
          feeds/apttrail_threat_feed_stix.json
          feeds/apttrail_suricata_datasets.tar.gz
          feeds/apttrail_misp_feed.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Only the changelog goes into git: a few KB per day, and it is the record
    # that the feed snapshots cannot provide.
    - name: Commit changelog
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Absent until the first run that observes an actual indicator change.
        if [ ! -d feeds/changes ]; then
          echo "No changelog directory yet"
          exit 0
        fi

        git add feeds/changes/
        if git diff --staged --quiet; then
          echo "No indicator changes to record"
          exit 0
        fi

        git commit -m "chore: record IOC changes"
        git push
        echo "Changelog committed and pushed"

    # Weekly immutable snapshot. The previous condition compared the cron
    # string against itself and was always false, so no release was ever
    # published. make_latest is false so these do not displace the rolling tag.
    - name: Decide weekly release tag
      id: weekly
      if: github.event_name == 'schedule'
      run: |
        TAG="weekly-$(date -u +%G-W%V)"
        if [ "$(date -u +%u)" != "7" ]; then
          echo "Not Sunday, skipping release"
        elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists, skipping release"
        else
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        fi

    - name: Create release (weekly)
      if: steps.weekly.outputs.tag != ''
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.weekly.outputs.tag }}
        name: APT Threat Feeds ${{ steps.weekly.outputs.tag }}
        body_path: release_notes.md
        make_latest: false
        files: |
          feeds/apttrail_threat_feed.json
          feeds/apttrail_threat_feed.csv
          feeds/apttrail_threat_feed_metadata.csv
          feeds/apttrail_threat_feed.rules
          feeds/apttrail_threat_feed.yar
          feeds/apttrail_threat_feed.yaml
          feeds/apttrail_threat_feed_stix.json
          feeds/apttrail_suricata_datasets.tar.gz
          feeds/apttrail_misp_feed.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}