name: Collect APT Threat Feeds

on:
  schedule:
    # Run every 1 hour
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      update_maltrail:
        description: 'Update Maltrail repository'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'apttrail_threat_feed_collector.py'
      - '.github/workflows/collect-apt-feeds.yml'

jobs:
  collect-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Clone/Update Maltrail repository
      run: |
        # apttrail handles cloning, but we can pre-clone if we want to cache or control location
        # Default location is data/maltrail
        # Note: apttrail will clone if missing
        echo "Repository update handled by apttrail package"

    - name: Collect APT indicators
      run: |
        pip install .
        python -m apttrail --output-dir feeds --collect-timestamps --suricata-dataset

    - name: Normalize timestamps and check for changes
      run: |
        # Normalize generated_at timestamp in JSON to avoid false positives
        # This allows us to detect real IOC changes vs just timestamp updates
        if [ -f feeds/apttrail_threat_feed.json ]; then
          python3 -c "
import json
from pathlib import Path

file = Path('feeds/apttrail_threat_feed.json')
data = json.loads(file.read_text())
# Set to a fixed timestamp for comparison
data['generated_at'] = '2024-01-01T00:00:00'
file.write_text(json.dumps(data, indent=2, sort_keys=True))
"
        fi

    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Only commit files that are under the 100MB limit
        # STIX and MISP are too large (100MB+) so we don't commit them to the repo
        git add feeds/apttrail_threat_feed.json
        git add feeds/apttrail_threat_feed.csv
        git add feeds/apttrail_threat_feed_metadata.csv
        git add feeds/apttrail_threat_feed.rules
        git add feeds/apttrail_threat_feed.yar
        git add feeds/apttrail_threat_feed.yaml

        if git diff --staged --quiet; then
          echo "No real changes detected (only timestamp updates)"
          exit 0
        fi

        # Generate meaningful commit message based on actual changes
        python3 .github/scripts/generate_commit_message.py > commit_message.txt
        
        if [ -s commit_message.txt ]; then
          git commit -F commit_message.txt
          git push
          echo "Changes committed and pushed"
        else
          echo "No meaningful changes to commit"
        fi

    - name: Create release (weekly)
      if: github.event_name == 'schedule' && contains('0 0 * * 0', github.event.schedule)
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: APT Threat Feeds Release ${{ github.run_number }}
        body_path: collection_report.md
        files: |
          feeds/apttrail_threat_feed.json
          feeds/apttrail_threat_feed.csv
          feeds/apttrail_threat_feed_metadata.csv
          feeds/apttrail_threat_feed.rules
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}